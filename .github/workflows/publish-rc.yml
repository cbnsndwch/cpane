name: Publish RC

on:
  push:
    tags:
      - 'v*-rc.*'
  workflow_dispatch:
    inputs:
      rc_version:
        description: 'Version in the form X.Y.Z-rc.N'
        required: true

permissions:
  contents: write

concurrency:
  group: publish-rc
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

  publish:
    needs: gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: pnpm install --frozen-lockfile

      - name: Resolve + verify version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION='${{ inputs.rc_version }}'
          else
            TAG="${GITHUB_REF_NAME}"
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
            VERSION="${TAG#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]

          PKG_VERSION=$(node -p "require('./apps/cli/package.json').version")
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "apps/cli/package.json version ($PKG_VERSION) does not match release version ($VERSION) — merge the Version Packages PR first." >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Cross-compile cpanext binaries (windows-x64, linux-x64, linux-arm64)
        working-directory: apps/cli
        run: |
          set -euo pipefail
          mkdir -p release
          bun build --compile --minify --target=bun-windows-x64 ./src/index.ts --outfile release/cpanext-windows-x64.exe
          bun build --compile --minify --target=bun-linux-x64   ./src/index.ts --outfile release/cpanext-linux-x64
          bun build --compile --minify --target=bun-linux-arm64 ./src/index.ts --outfile release/cpanext-linux-arm64

      - name: Publish GitHub prerelease
        run: |
          gh release create "$TAG" \
            apps/cli/release/cpanext-windows-x64.exe \
            apps/cli/release/cpanext-linux-x64 \
            apps/cli/release/cpanext-linux-arm64 \
            --title "cpanext $TAG" \
            --notes "Release-candidate build — for testing new features/schema changes before they reach stable. See CHANGELOG.md." \
            --prerelease
