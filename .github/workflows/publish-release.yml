name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Reject rc tags (publish-rc.yml handles those)
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "Tag ${GITHUB_REF_NAME} looks like an rc tag — publish-rc.yml handles those, not this workflow."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

  build-and-draft:
    needs: gate
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: pnpm install --frozen-lockfile

      - name: Resolve + verify version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${TAG#v}"

          PKG_VERSION=$(node -p "require('./apps/cli/package.json').version")
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "apps/cli/package.json version ($PKG_VERSION) does not match tag ($VERSION) — merge the Version Packages PR first." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cross-compile cpane binaries (windows-x64, linux-x64, linux-arm64)
        working-directory: apps/cli
        run: |
          set -euo pipefail
          mkdir -p release
          bun build --compile --minify --target=bun-windows-x64 ./src/index.ts --outfile release/cpane-windows-x64.exe
          bun build --compile --minify --target=bun-linux-x64   ./src/index.ts --outfile release/cpane-linux-x64
          bun build --compile --minify --target=bun-linux-arm64 ./src/index.ts --outfile release/cpane-linux-arm64

      - name: Create draft release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            apps/cli/release/cpane-windows-x64.exe \
            apps/cli/release/cpane-linux-x64 \
            apps/cli/release/cpane-linux-arm64 \
            --title "cpane ${GITHUB_REF_NAME}" \
            --draft

  finalize:
    needs: build-and-draft
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download draft release assets
        run: |
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" --dir release-assets

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Upload checksums
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/SHA256SUMS.txt

      - name: Extract this version's changelog section
        run: |
          VERSION="${{ needs.build-and-draft.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "$" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' apps/cli/CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No changelog section found for $VERSION — falling back to a minimal note."
            echo "cpane $VERSION" > release-notes.md
          fi

      - name: Publish (un-draft) the release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --notes-file release-notes.md
